<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" role="img" aria-labelledby="title">
    <title id="title">معاينة مجموعة الأغصان</title>

    <defs>
        <linearGradient id="leafDark" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#6f8d5e" />
            <stop offset="1" stop-color="#9fbb8c" />
        </linearGradient>
        <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#8aa879" />
            <stop offset="1" stop-color="#c3d7ad" />
        </linearGradient>
        <radialGradient id="petal" cx="0.5" cy="0.6" r="0.6">
            <stop offset="0" stop-color="#f6dcdc" />
            <stop offset="1" stop-color="#dba7aa" />
        </radialGradient>

        <!-- ورقة بعروق، تتجه نحو اليمين -->
        <g id="leaf">
            <path d="M0 0C6 -9 24 -13 40 0C24 13 6 9 0 0Z" stroke="#587449" stroke-width="0.8" />
            <g fill="none" stroke="#4f6b42" stroke-width="0.7" stroke-linecap="round" opacity="0.8">
                <path d="M1 0H35" />
                <path d="M10 0L18 -5M10 0L18 5M20 0L28 -5M20 0L28 5" />
            </g>
        </g>

        <!-- وردة صغيرة -->
        <g id="blossom">
            <g fill="url(#petal)" stroke="#c28f93" stroke-width="0.7">
                <ellipse cx="0" cy="-7" rx="4.6" ry="6" />
                <ellipse cx="6.7" cy="-2.2" rx="4.6" ry="6" transform="rotate(72 6.7 -2.2)" />
                <ellipse cx="4.1" cy="5.7" rx="4.6" ry="6" transform="rotate(144 4.1 5.7)" />
                <ellipse cx="-4.1" cy="5.7" rx="4.6" ry="6" transform="rotate(216 -4.1 5.7)" />
                <ellipse cx="-6.7" cy="-2.2" rx="4.6" ry="6" transform="rotate(288 -6.7 -2.2)" />
            </g>
            <circle r="3" fill="#d9b45a" stroke="#b69a50" stroke-width="0.6" />
            <g fill="#8a6a2f">
                <circle cx="0" cy="-1.2" r="0.6" />
                <circle cx="1.2" cy="0.6" r="0.6" />
                <circle cx="-1.2" cy="0.6" r="0.6" />
            </g>
        </g>

        <!-- برعم -->
        <g id="bud">
            <ellipse cx="0" cy="-5" rx="3.2" ry="5.5" fill="#e8bfc0" stroke="#c28f93"
                stroke-width="0.7" />
            <path d="M-3 0C-2 -2 2 -2 3 0C2 3 -2 3 -3 0Z" fill="#8fa981" stroke="#587449"
                stroke-width="0.6" />
        </g>

        <!-- الغصن الكامل (الجهة اليسرى) -->
        <g id="branch" stroke-linecap="round" stroke-linejoin="round">

            <!-- الفروع الجانبية -->
            <g fill="none" stroke="#9a7a45" stroke-width="2.2">
                <path d="M66 246C45 225 30 205 28 170" />
                <path d="M126 163C118 135 120 105 140 78" />
                <path d="M93 203C125 210 150 225 172 250" />
            </g>

            <!-- الساق الرئيسية -->
            <path d="M30 340C60 230 120 140 255 68" fill="none" stroke="#8a6b38" stroke-width="5" />
            <path d="M30 340C60 230 120 140 255 68" fill="none" stroke="#c9a96a" stroke-width="1.5"
                transform="translate(-1 -1)" opacity="0.7" />

            <!-- أوراق الساق الرئيسية -->
            <g fill="url(#leafDark)">
                <use href="#leaf" transform="translate(46 292) rotate(-125) scale(1.05)" />
                <use href="#leaf" transform="translate(66 246) rotate(-115) scale(1.1)" />
                <use href="#leaf" transform="translate(93 203) rotate(-102) scale(1.1)" />
                <use href="#leaf" transform="translate(126 163) rotate(-90) scale(1.05)" />
                <use href="#leaf" transform="translate(167 125) rotate(-80) scale(1.0)" />
                <use href="#leaf" transform="translate(217 90) rotate(-75) scale(0.9)" />
                <use href="#leaf" transform="translate(255 68) rotate(-20) scale(1.0)" />
            </g>
            <g fill="url(#leafLight)">
                <use href="#leaf" transform="translate(46 292) rotate(-25) scale(0.95)" />
                <use href="#leaf" transform="translate(66 246) rotate(-15) scale(1.0)" />
                <use href="#leaf" transform="translate(93 203) rotate(-2) scale(1.0)" />
                <use href="#leaf" transform="translate(126 163) rotate(10) scale(0.95)" />
                <use href="#leaf" transform="translate(167 125) rotate(20) scale(0.9)" />
                <use href="#leaf" transform="translate(217 90) rotate(25) scale(0.8)" />
                <use href="#leaf" transform="translate(255 68) rotate(-50) scale(0.7)" />
            </g>

            <!-- أوراق الفرع 1 (يسار) -->
            <g fill="url(#leafDark)">
                <use href="#leaf" transform="translate(47 226) rotate(-170) scale(0.6)" />
                <use href="#leaf" transform="translate(34 198) rotate(-140) scale(0.6)" />
                <use href="#leaf" transform="translate(28 170) rotate(-95) scale(0.65)" />
            </g>
            <g fill="url(#leafLight)">
                <use href="#leaf" transform="translate(47 226) rotate(-90) scale(0.55)" />
                <use href="#leaf" transform="translate(34 198) rotate(-60) scale(0.55)" />
            </g>

            <!-- أوراق الفرع 2 (وسط) -->
            <g fill="url(#leafDark)">
                <use href="#leaf" transform="translate(121 135) rotate(-130) scale(0.65)" />
                <use href="#leaf" transform="translate(140 78) rotate(-60) scale(0.65)" />
            </g>
            <g fill="url(#leafLight)">
                <use href="#leaf" transform="translate(121 135) rotate(-40) scale(0.6)" />
                <use href="#leaf" transform="translate(128 106) rotate(-130) scale(0.55)" />
            </g>

            <!-- أوراق الفرع 3 (سفلي) -->
            <g fill="url(#leafDark)">
                <use href="#leaf" transform="translate(125 212) rotate(-35) scale(0.6)" />
                <use href="#leaf" transform="translate(172 250) rotate(45) scale(0.6)" />
            </g>
            <g fill="url(#leafLight)">
                <use href="#leaf" transform="translate(125 212) rotate(65) scale(0.55)" />
            </g>

            <!-- حبّات توت صغيرة -->
            <g fill="#c98a8f" stroke="#a5666c" stroke-width="0.6">
                <circle cx="150" cy="232" r="3" />
                <circle cx="156" cy="238" r="2.6" />
                <circle cx="146" cy="240" r="2.4" />
                <circle cx="26" cy="160" r="2.8" />
                <circle cx="32" cy="164" r="2.4" />
            </g>

            <!-- ورود وبراعم -->
            <use href="#blossom" transform="translate(142 138) scale(1.05)" />
            <use href="#blossom" transform="translate(198 104) scale(0.9)" />
            <use href="#blossom" transform="translate(62 262) scale(0.9)" />
            <use href="#blossom" transform="translate(142 72) scale(0.7)" />
            <use href="#bud" transform="translate(104 190) rotate(-30)" />
            <use href="#bud" transform="translate(40 190) rotate(-40) scale(0.9)" />
        </g>
    </defs>

    <!-- الخلفية والإطار -->
    <rect width="540" height="360" fill="#fffaf1" />
    <rect x="10" y="10" width="520" height="340" rx="10" fill="none" stroke="#e6d3a8"
        stroke-width="1" />

    <!-- الغصنان -->
    <use href="#branch" />
    <use href="#branch" transform="translate(540 0) scale(-1 1)" />

    <!-- زخرفة المنتصف العلوي -->
    <g transform="translate(270 62)">
        <use href="#leaf" transform="rotate(200) scale(0.7)" fill="url(#leafDark)" />
        <use href="#leaf" transform="rotate(-20) scale(0.7)" fill="url(#leafDark)" />
        <use href="#blossom" transform="translate(0 -4) scale(1.3)" />
    </g>

    <!-- خط زخرفي + النص -->
    <g stroke="#b69a50" stroke-width="1.5" stroke-linecap="round">
        <path d="M190 300H252M288 300H350" />
    </g>
    <path d="M270 294l5 6-5 6-5-6z" fill="#b69a50" />

    <text x="270" y="338" text-anchor="middle" fill="#866143" font-family="sans-serif"
        font-size="19">معاينة ميثاق</text>
</svg>