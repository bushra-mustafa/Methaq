  <g font-family="Amiri, 'Times New Roman', serif" text-anchor="middle">
    <text x="270" y="200" font-size="18" fill="#936b47">لَيْلَةٌ مِنَ الفَرَح</text>
    <text x="270" y="250" font-size="15" fill="#7f5a4a">يسعدنا أن نجتمع بكم في ليلة نحتفل فيها</text>
    <text x="270" y="276" font-size="15" fill="#7f5a4a">بالحب والفرح، ونرجو لأيامنا البركة.</text>
    <text x="270" y="330" font-size="24" fill="#5b1830">اللهم بارك لنا وبارك علينا</text>
    <text x="270" y="364" font-size="24" fill="#5b1830">واجمع بيننا في خير</text>
    <text x="270" y="412" font-size="14" fill="#7f5a4a">يسعدنا دعوتكم لمشاركتنا ليلة الحنّة</text>
    <text x="270" y="520" font-size="64" fill="#5b1830">نوارة</text>
    <text x="270" y="632" font-size="13" fill="#7f5a4a">الموعد</text>
    <text x="270" y="690" font-size="44" fill="#5b1830" font-family="'Cormorant Garamond', Georgia, serif" direction="ltr">18 / 9</text>
    <text x="270" y="722" font-size="12" fill="#7f5a4a">الخميس، الثامنة مساءً</text>
    <text x="270" y="820" font-size="24" fill="#5b1830">بحضوركم تكتمل فرحتنا</text>
  </g>
